services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
    ports:
      - "5678:5678"

  client_1:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_1
    depends_on:
      - server
    environment:
      - AGENCY_ID=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE=input-1.csv
      - OUTPUT_DIR=/output
    volumes:
      - ./input/input-1.csv:/input-1.csv:ro
      - ./output:/output
  client_2:
